<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sqwen — 推理引擎</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 2rem; color: #333; background: #fff; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { margin-bottom: 1rem; }
        textarea { width: 100%; height: 120px; padding: 0.5rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; resize: vertical; }
        button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; background: #0066cc; color: #fff; border: none; border-radius: 4px; margin-top: 0.5rem; }
        button:hover { background: #0055aa; }
        .output { margin-top: 1rem; padding: 1rem; background: #f5f5f5; border-radius: 4px; min-height: 200px; white-space: pre-wrap; font-size: 0.95rem; }
        .reasoning { margin-top: 1rem; padding: 0.75rem 1rem; background: #fbfbf3; border-left: 3px solid #ddd; border-radius: 4px; white-space: pre-wrap; font-size: 0.85rem; color: #777; }
        .reasoning:empty { display: none; }
        .speed-panel { margin-top: 1rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; }
        .speed-card { background: #e8f0fe; padding: 0.75rem; border-radius: 4px; text-align: center; }
        .speed-card h3 { margin: 0; font-size: 0.85rem; color: #666; }
        .speed-card p { margin: 0.25rem 0 0; font-size: 1.25rem; font-weight: bold; color: #0066cc; }
        .bench-section { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #ccc; }
    </style>
</head>
<body>
<div class="container">
    <h1>Sqwen 推理引擎</h1>
    <p>Qwen3.6-35B-A3B GGUF 推理引擎 — OpenAI 兼容 API + WebUI</p>

    <textarea id="prompt" placeholder="输入 prompt...">用一句话介绍你自己</textarea>
    <button onclick="runChat()">发送</button>

    <div class="speed-panel" id="speedPanel" style="display:none;">
        <div class="speed-card"><h3>TTFT</h3><p id="ttft">—</p></div>
        <div class="speed-card"><h3>Prompt Eval Rate</h3><p id="promptRate">—</p></div>
        <div class="speed-card"><h3>Eval Rate</h3><p id="evalRate">—</p></div>
        <div class="speed-card"><h3>Total Time</h3><p id="totalTime">—</p></div>
    </div>

    <div class="output" id="output"></div>
    <div class="reasoning" id="reasoning"></div>

    <div class="bench-section">
        <h2>Bench 模式</h2>
        <button onclick="runBench()">Run bench</button>
        <div class="output" id="benchOutput" style="min-height: 60px;"></div>
    </div>
</div>

<script>
const API = "/v1/chat/completions";
const BENCH = "/v1/bench";

async function runChat() {
    const prompt = document.getElementById("prompt").value;
    const output = document.getElementById("output");
    const reasoningBox = document.getElementById("reasoning");
    const speedPanel = document.getElementById("speedPanel");
    output.textContent = "（思考中…）";
    reasoningBox.textContent = "";
    speedPanel.style.display = "none";

    const t0 = performance.now();
    let ttftShown = false;
    let answer = "";
    let reasoning = "";
    // 服务端在**收尾分片**里回传 usage + 三项速率（以前只写 stderr，于是这两格永远是「—」）
    let lastMetrics = null;
    try {
        const resp = await fetch(API, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            // max_tokens 要留够思考的空间：本模型的推理动辄上千 token，给 128 会
            // 全部耗在思考上、回答为空（看起来就像"没有响应"）。
            // 服务端会从思考预算里再扣 256 给正文，所以这一项主要是「够不够长」。
            body: JSON.stringify({ model: "sqwen", messages: [{ role: "user", content: prompt }], stream: true, max_tokens: 8192 }),
        });
        if (!resp.ok) {
            output.textContent = "HTTP " + resp.status + ": " + (await resp.text());
            return;
        }
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        // SSE 行可能被 TCP 分片切开，必须**按行缓冲**再解析（以前直接 split 每个 chunk，
        // 真流式下会把 JSON 拦腰截断）
        let buffer = "";
        let done = false;
        while (!done) {
            const { done: eof, value } = await reader.read();
            if (eof) break;
            buffer += decoder.decode(value, { stream: true });
            let nl;
            while ((nl = buffer.indexOf("\n")) >= 0) {
                const line = buffer.slice(0, nl).replace(/\r$/, "");
                buffer = buffer.slice(nl + 1);
                if (!line.startsWith("data:")) continue; // 注释行（keep-alive）与其它字段忽略
                const data = line.slice(5).trim();
                if (data === "[DONE]") {
                    done = true;
                    break;
                }
                let obj;
                try {
                    obj = JSON.parse(data);
                } catch (e) {
                    continue;
                }
                if (obj.error) {
                    output.textContent = "服务端错误: " + (obj.error.message || JSON.stringify(obj.error));
                    return;
                }
                // 收尾分片带 usage + 三项速率（服务端算好的，跳过冷启动的稳态口径
                // 才是和 llama.cpp 的 tg_3s 对齐的口径）
                if (obj.prompt_eval_rate !== undefined) {
                    lastMetrics = obj;
                }
                const delta = obj.choices?.[0]?.delta || {};
                if (delta.reasoning_content) {
                    reasoning += delta.reasoning_content;
                    reasoningBox.textContent = reasoning;
                }
                const content = delta.content || "";
                if (content.length > 0) {
                    if (!ttftShown) {
                        document.getElementById("ttft").textContent = (performance.now() - t0).toFixed(0) + " ms";
                        ttftShown = true;
                        output.textContent = "";
                    }
                    answer += content;
                    output.textContent = answer;
                }
            }
        }
        if (!answer) {
            output.textContent = "（回答为空：思考没有在 max_tokens 内结束。加大 max_tokens，"
                + "或用 --reasoning off / --reasoning-budget N 启动 server）";
        }
        speedPanel.style.display = "grid";
        document.getElementById("totalTime").textContent = (performance.now() - t0).toFixed(0) + " ms";
        if (!ttftShown) document.getElementById("ttft").textContent = "—";

        // 两个速率用服务端算的值；拿不到就退回「客户端自测」的近似值（token 数 / 墙钟）。
        const pr = document.getElementById("promptRate");
        const er = document.getElementById("evalRate");
        if (lastMetrics) {
            const fmt = (v) => v > 0 ? (v >= 100 ? v.toFixed(0) : v.toFixed(1)) + " t/s" : "—";
            pr.textContent = fmt(lastMetrics.prompt_eval_rate);
            // 稳态口径更有意义（跳过冷启动）；拿不到再用累计
            er.textContent = fmt(lastMetrics.eval_rate_steady || lastMetrics.eval_rate);
            if (lastMetrics.ttft_ms) {
                document.getElementById("ttft").textContent = lastMetrics.ttft_ms.toFixed(0) + " ms";
            }
        } else {
            pr.textContent = "—";
            er.textContent = "—";
        }
    } catch (e) {
        output.textContent = "Error: " + e.message;
    }
}

async function runBench() {
    const out = document.getElementById("benchOutput");
    try {
        const resp = await fetch(BENCH + "?prompt_tokens=1024&gen_tokens=128", { method: "POST" });
        const data = await resp.json();
        out.textContent = JSON.stringify(data, null, 2);
    } catch (e) {
        out.textContent = "Error: " + e.message;
    }
}
</script>
</body>
</html>
